x-common-volumes: &common-volumes
  - ./config.toml:/MoneyMachine/config.toml
  - ./storage:/MoneyMachine/storage

services:
  webui:
    image: ghcr.io/lucasgazula/moneymachine:latest
    container_name: "moneymachine-webui"
    ports:
      - "127.0.0.1:8501:8501"
    command: [ "python", "-m", "uvicorn", "app.asgi:app", "--host=0.0.0.0", "--port=8501" ]
    volumes: *common-volumes
    restart: always
  api:
    profiles: ["api"]
    image: ghcr.io/lucasgazula/moneymachine:latest
    container_name: "moneymachine-api"
    ports:
      - "127.0.0.1:8080:8080"
    command: [ "python3", "main.py" ]
    volumes: *common-volumes
    restart: always
